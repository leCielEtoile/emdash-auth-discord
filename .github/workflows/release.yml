name: Release

# タグ（v*）の push で npm へ公開する。npm の Trusted Publishing（OIDC）を使うため NPM_TOKEN は不要。
# 事前準備:
#   - npmjs.com で Trusted Publisher を登録する（リポジトリ: このリポジトリ / ワークフロー: release.yml / 環境: npm-publish）
#   - GitHub の Settings > Environments で npm-publish を作り、必須レビュアーを設定する
#   - GitHub の Ruleset で v* タグの作成を管理者に限定する
# リリースには tarball と SBOM（CycloneDX / SPDX）を添付する。署名（attestation）は CycloneDX のみ。
# アクションはフルコミット SHA で固定する。更新は Dependabot に任せる。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 検査・テスト・パッケージ作成。OIDC トークンは発行できない（id-token なし）・依存キャッシュは使わない
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.node.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: タグのコミットが origin/main の祖先であることを確認
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "タグ ${GITHUB_REF_NAME} のコミットは main に含まれていません" >&2
            exit 1
          fi
      - name: タグと package.json の version が一致することを確認
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と package.json の version v${PKG_VERSION} が一致しません" >&2
            exit 1
          fi
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - id: pack
        name: パッケージを作成
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          echo "tarball=$(cd dist && ls *.tgz)" >> "$GITHUB_OUTPUT"
      - name: SBOM を作成
        run: |
          pnpm sbom --sbom-format cyclonedx --prod --lockfile-only --out dist/sbom.cdx.json
          pnpm sbom --sbom-format spdx --prod --lockfile-only --out dist/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/*.tgz
            dist/sbom.cdx.json
            dist/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  # 公開のみ。OIDC（id-token: write）はこのジョブだけに与え、依存のインストールやスクリプトの実行はしない
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted Publishing には npm 11.5.1 以上が必要。メジャーを固定する
      - name: npm を更新
        run: npm install -g npm@11
      - name: 公開
        run: npm publish "./${{ needs.build.outputs.tarball }}" --provenance --access public

  # CycloneDX の SBOM を tarball に紐づけて署名する。checkout も install もしない
  attest:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.tarball }}
          sbom-path: sbom.cdx.json

  # npm への公開と署名が済んだ後に GitHub Release を作り、tarball と SBOM を添付する
  release:
    needs: [build, publish, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${TARBALL}" sbom.cdx.json sbom.spdx.json \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
